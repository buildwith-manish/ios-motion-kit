# Premium 3D region insert: 4K stills, one parallel job per state x shape, then one commit with all the PNGs.
name: Map 3D stills
on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Render scale (2 = 4K)'
        default: '2'
      times:
        description: 'Comma-separated seconds'
        default: '0.6,1.2,2.8'
permissions:
  contents: read
concurrency:
  group: map-3d-stills
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
  render:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state:
          - {id: '08', name: Colorado}
          - {id: '12', name: Florida}
          - {id: '26', name: Michigan}
        shape: [landscape, portrait]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - name: Render
        run: |
          mkdir -p logs
          node scripts/map_3d_still.mjs --id=${{ matrix.state.id }} --name=${{ matrix.state.name }} --shape=${{ matrix.shape }} --scale=${{ inputs.scale || '2' }} --times=${{ inputs.times || '0.6,1.2,2.8' }} --out=out 2>&1 | grep -v "^Bundling\|^Copying" | tee logs/${{ matrix.state.name }}-${{ matrix.shape }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-3d-stills-${{ matrix.state.name }}-${{ matrix.shape }}
          path: |
            out/*.png
            logs/*.log
          retention-days: 14
          if-no-files-found: warn
