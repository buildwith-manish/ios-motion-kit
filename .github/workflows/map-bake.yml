# Bakes city street/water/park detail from Census TIGER/Line (one job, city by city), then alignment + credits, publishes the data as a new release and commits the manifest and reports.
# Run: Actions -> "Bake map cities" -> Run workflow (cities blank = every city in cities.json that is not baked yet).
name: Bake map cities
on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'city ids, comma separated (blank = all missing)'
        default: ''
      detail:
        description: 'light | rich | both'
        default: 'both'
      budget:
        description: 'rich size budget per city, KB'
        default: '400'
      force:
        description: 'rebake even if the file exists (true/false)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: kit-data-bake
  cancel-in-progress: false
jobs:
  # One job: baked planes are not committed, so every step has to share one workspace.
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - uses: actions/cache@v4
        with:
          path: .cache/census
          key: tiger-${{ github.run_id }}
          restore-keys: tiger-
      - name: Bake the requested (or missing) cities
        id: bake
        continue-on-error: true
        env:
          CITIES: ${{ inputs.cities }}
          DETAIL: ${{ inputs.detail || 'both' }}
          BUDGET: ${{ inputs.budget || '400' }}
          FORCE: ${{ inputs.force }}
        run: |
          mkdir -p docs/map-bake-logs
          ids=$(node -e "
          const fs=require('fs');
          const all=JSON.parse(fs.readFileSync('public/kit/map/cities.json','utf8')).map(c=>c.id);
          const want=(process.env.CITIES||'').split(',').map(s=>s.trim()).filter(Boolean);
          const d=process.env.DETAIL;
          const missing=id=>(d!=='light'&&!fs.existsSync('public/kit/map/cities/'+id+'.json'))||(d!=='rich'&&!fs.existsSync('public/kit/map/cities/'+id+'.light.json'));
          console.log((want.length?want:(process.env.FORCE==='true'?all:all.filter(missing))).join(' '));
          ")
          echo "cities: ${ids:-none}"
          force=""; if [ "$FORCE" = "true" ]; then force=1; fi
          failed=0
          for id in $ids; do
            node scripts/map_bake_city.mjs "$id" --detail="$DETAIL" --budget="$BUDGET" --force="$force" 2>&1 | tee "docs/map-bake-logs/city-$id.log"
            [ "${PIPESTATUS[0]}" = 0 ] || failed=1
          done
          (node scripts/map_bake_alignment.mjs 2>&1 | tee docs/map-bake-logs/alignment.log) || echo "alignment failed (see log)"
          node scripts/map_bake_city_report.mjs 2>&1 | tee docs/map-bake-logs/report.log || true
          exit $failed
      - name: Publish changed data as a new release; commit only the manifest, reports and logs
        if: steps.bake.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(sha256sum data-manifest.json)
          node scripts/kit_data_manifest.mjs
          if [ "$before" != "$(sha256sum data-manifest.json)" ]; then
            node scripts/kit_data_manifest.mjs --release "data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            bash scripts/kit_data_publish.sh
          fi
      - name: Commit manifest, reports and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if [ "${{ steps.bake.outcome }}" = "success" ]; then git add data-manifest.json public/kit/map; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "kit-map: bake cities [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
      - name: Fail the job if the bake failed
        if: steps.bake.outcome == 'failure'
        run: exit 1
