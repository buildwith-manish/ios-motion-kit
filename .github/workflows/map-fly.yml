# Renders the fly-through demo (stills, 4K crops, one landscape video + contact sheet) and measures seconds per frame
# over the whole timeline. Commits the results to kit-map. Runs when its files change on kit-map, or manually.
name: Map fly
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'render the landscape video (true | false)'
        default: 'true'
  push:
    branches: [kit-map]
    paths:
      - .github/workflows/map-fly.yml
      - scripts/map_fly_stills.mjs
      - src/kit/demo/FlyDemo.tsx
      - src/kit/map/FlyMap.tsx
      - src/kit/map/mapCamera.ts
      - src/kit/map/MapPin.tsx
      - src/kit/map/MapCallout.tsx
      - src/kit/map/Arc.tsx
      - src/kit/map/RouteDraw.tsx
      - src/kit/map/overlayGeometry.ts
permissions:
  contents: write
concurrency:
  group: map-fly
  cancel-in-progress: false
jobs:
  fly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kit-map
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Typecheck (once, before rendering)
        run: npx tsc --noEmit
      - name: Stills + timing
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          node scripts/map_fly_stills.mjs 2>&1 | grep -v "^Bundling\|^Copying" | tee docs/map-bake-logs/fly.log
      - name: Video + contact sheet
        if: ${{ (inputs.video || 'true') == 'true' }}
        continue-on-error: true
        run: |
          mkdir -p docs/previews/kit-map/fly/video
          npx remotion render src/kit/demo/entry.tsx Kit-Fly-Landscape docs/previews/kit-map/fly/video/fly-landscape.mp4 --concurrency=2 2>&1 | grep -v "^Bundling\|^Copying" | tail -5 | tee -a docs/map-bake-logs/fly.log
          ffmpeg -y -loglevel error -i docs/previews/kit-map/fly/video/fly-landscape.mp4 -vf "fps=1,scale=480:-1,tile=5x3" -frames:v 1 docs/previews/kit-map/fly/video/fly-landscape-sheet.png
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/kit-map/fly docs/map-bake-logs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "kit-map: fly stills + perf [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin kit-map && git push origin HEAD:kit-map && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
