# Renders the fly-through demo (stills, 4K crops, one landscape video + contact sheet) and measures seconds per frame
# over the whole timeline. Manual; results are uploaded as a 14-day artifact.
name: Map fly
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'render the landscape video (true | false)'
        default: 'true'
permissions:
  contents: read
concurrency:
  group: map-fly
  cancel-in-progress: false
jobs:
  fly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Typecheck (once, before rendering)
        run: npx tsc --noEmit
      - name: Stills + timing
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          node scripts/map_fly_stills.mjs 2>&1 | grep -v "^Bundling\|^Copying" | tee docs/map-bake-logs/fly.log
      - name: Video + contact sheet
        if: ${{ (inputs.video || 'true') == 'true' }}
        continue-on-error: true
        run: |
          mkdir -p docs/previews/kit-map/fly/video
          npx remotion render src/kit/demo/entry.tsx Kit-Fly-Landscape docs/previews/kit-map/fly/video/fly-landscape.mp4 --concurrency=2 2>&1 | grep -v "^Bundling\|^Copying" | tail -5 | tee -a docs/map-bake-logs/fly.log
          ffmpeg -y -loglevel error -i docs/previews/kit-map/fly/video/fly-landscape.mp4 -vf "fps=1,scale=480:-1,tile=5x3" -frames:v 1 docs/previews/kit-map/fly/video/fly-landscape-sheet.png
      - name: Collect new outputs (never committed)
        if: always()
        run: |
          mkdir -p out/artifact
          git ls-files -z -o -m docs/previews docs/map-bake-logs | xargs -0 -r cp --parents -t out/artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-fly
          path: out/artifact
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
