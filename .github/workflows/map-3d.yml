# Timing spike for the optional 3D region insert: seconds per frame at 1080p and 4K, software GL. Manual; results are uploaded as a 14-day artifact.
name: Map 3D
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-3d
  cancel-in-progress: false
jobs:
  three:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Timing
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          node scripts/map_3d_timing.mjs 2>&1 | grep -v "^Bundling\|^Copying" | tee docs/map-bake-logs/three.log
      - name: Collect new outputs (never committed)
        if: always()
        run: |
          mkdir -p out/artifact
          git ls-files -z -o -m docs/previews docs/map-bake-logs | xargs -0 -r cp --parents -t out/artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-3d
          path: out/artifact
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
