# Timing spike for the optional 3D region insert: seconds per frame at 1080p and 4K, software GL. Commits the results to kit-map.
name: Map 3D
on:
  workflow_dispatch:
  push:
    branches: [kit-map]
    paths:
      - .github/workflows/map-3d.yml
      - scripts/map_3d_timing.mjs
      - src/kit/map/three/**
      - src/kit/demo/Region3DDemo.tsx
      - src/kit/demo/entry3d.tsx
permissions:
  contents: write
concurrency:
  group: map-3d
  cancel-in-progress: false
jobs:
  three:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kit-map
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Timing
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          node scripts/map_3d_timing.mjs 2>&1 | grep -v "^Bundling\|^Copying" | tee docs/map-bake-logs/three.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/kit-map/three docs/map-bake-logs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "kit-map: 3D region stills + perf [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin kit-map && git push origin HEAD:kit-map && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
