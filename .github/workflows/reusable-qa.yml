# Reusable workflow (workflow_call). Private kit: the caller passes KIT_TOKEN (secrets: inherit); see docs/ci-reuse.md.
name: Reusable QA (contrast, safe area, motion, layout lint, loudness)
on:
  workflow_call:
    inputs:
      comps: { description: 'Composition ids, comma separated', required: true, type: string }
      entry: { description: 'Remotion entry file', required: false, type: string, default: 'src/index.ts' }
      times: { description: 'Sample times in seconds, comma separated (empty = every 0.5 s)', required: false, type: string, default: '' }
      kit_dir: { description: 'Where the kit lives in the caller (submodule path; "." inside the kit itself)', required: false, type: string, default: 'kit' }
      layout_fail: { description: 'Layout lint violations fail the job', required: false, type: boolean, default: true }
      layout_config: { description: 'Optional JSON file overriding the layout-lint thresholds', required: false, type: string, default: '' }
      loudness_comp: { description: 'Composition whose mix is checked against -14 LUFS (empty = skip)', required: false, type: string, default: '' }
      artifact: { description: 'Artifact name for the reports', required: false, type: string, default: 'qa-report' }
    secrets:
      KIT_TOKEN:
        description: 'Fine-grained token, Contents: read-only on the private ios-motion-kit repo (see docs/ci-reuse.md)'
        required: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIT: ${{ inputs.kit_dir }}
      KIT_NO_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.KIT_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Kit dependencies (kit used as a submodule)
        run: if [ "${{ inputs.kit_dir }}" != "." ] && [ -f "${{ inputs.kit_dir }}/package-lock.json" ]; then npm ci --prefix "${{ inputs.kit_dir }}"; fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Sampling arguments
        id: a
        run: |
          T="${{ inputs.times }}"
          if [ -n "$T" ]; then echo "t=--times $T" >> "$GITHUB_OUTPUT"; else echo "t=" >> "$GITHUB_OUTPUT"; fi
      - name: Contrast
        run: node "$KIT/scripts/kit_contrast_check.mjs" --comp "${{ inputs.comps }}" --entry "${{ inputs.entry }}" ${{ steps.a.outputs.t }} --no-images --out out/qa/contrast
      - name: Safe area
        if: ${{ !cancelled() }}
        run: node "$KIT/scripts/kit_safe_area_check.mjs" --comp "${{ inputs.comps }}" --entry "${{ inputs.entry }}" ${{ steps.a.outputs.t }} --no-images --out out/qa/safe-area
      - name: Motion
        if: ${{ !cancelled() }}
        run: node "$KIT/scripts/kit_motion_audit.mjs" --comp "${{ inputs.comps }}" --entry "${{ inputs.entry }}" --fps 5 --scale 0.15 --min-static 2 --out out/qa/motion
      - name: Layout lint
        if: ${{ !cancelled() }}
        run: |
          ARGS=""
          if [ "${{ inputs.layout_fail }}" != "true" ]; then ARGS="$ARGS --no-fail"; fi
          if [ -n "${{ inputs.layout_config }}" ]; then ARGS="$ARGS --config ${{ inputs.layout_config }}"; fi
          node "$KIT/scripts/kit_layout_lint.mjs" --comp "${{ inputs.comps }}" --entry "${{ inputs.entry }}" ${{ steps.a.outputs.t }} --no-images --out out/qa/layout $ARGS
      - name: Loudness gate (-14 LUFS)
        if: ${{ !cancelled() && inputs.loudness_comp != '' }}
        run: node "$KIT/scripts/kit_loudness.mjs" --comp "${{ inputs.loudness_comp }}" --entry "${{ inputs.entry }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: '${{ inputs.artifact }}', path: out/qa, retention-days: 7, if-no-files-found: ignore }
