# Push-to-main gate. Job 1 always runs; heavy QA + visual run on workflow_dispatch or when the head commit message contains "[qa]".
name: kit-main-ci
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'templates/**', 'package*.json', 'tests/**', '.github/workflows/kit-main-ci.yml', '.github/workflows/reusable-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    name: Typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: pip install numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:unit
  heavy:
    name: QA (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIT_NO_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: tokens, entry: src/kit/demo/entry.tsx, comp: Kit-Tokens-Demo, times: '0.8,2,3.2' }
          - { suite: transitions, entry: src/kit/demo/entry.tsx, comp: Kit-Transitions-Demo, times: '1.7,3.9,6.1,8.3,10.5,12.7' }
          - { suite: ui, entry: src/kit/ui/entry.tsx, comp: 'Kit-Ui-Demo,Kit-Ui-Demo-Vertical,Kit-Ui-Demo-30fps', times: '2,4.5,7.5,8.5' }
          - { suite: charts, entry: src/kit/demo/entry.tsx, comp: 'Kit-Charts-Demo,Kit-Charts-Demo-Vertical,Kit-Charts-Demo-30fps', times: '2.4,5.6,8.8,12,15.2,18.4,21.6,24.8,28,31.2' }
          - { suite: scenes, entry: src/kit/scenes/entry.tsx, comp: Kit-Scenes-Demo, times: '2,7,12,17,22,27' }
          - { suite: chart-headline, entry: src/kit/scenes/entry.tsx, comp: 'Kit-ChartHeadline-Demo,Kit-ChartHeadline-Demo-Vertical', times: '1.5,3,5.5,10,12,14,17' }
          - { suite: production, entry: src/kit/production/entry.tsx, comp: 'Kit-Production-Demo,Kit-Production-Demo-Vertical', times: '1.5,4,8,13,18' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/kit_contrast_check.mjs --comp "${{ matrix.comp }}" --entry "${{ matrix.entry }}" --times "${{ matrix.times }}" --no-images --out "out/main-qa/${{ matrix.suite }}/contrast"
      - run: node scripts/kit_safe_area_check.mjs --comp "${{ matrix.comp }}" --entry "${{ matrix.entry }}" --times "${{ matrix.times }}" --no-images --out "out/main-qa/${{ matrix.suite }}/safe-area"
      - name: Safe-area findings as annotations (diagnostic only)
        if: failure()
        run: |
          for f in $(find out/main-qa/${{ matrix.suite }}/safe-area -name '*.json' | head -3); do python3 -c "import json,sys;print('::error::'+json.dumps(json.load(open(sys.argv[1])))[:3500])" "$f"; done
      - run: node scripts/kit_motion_audit.mjs --comp "${{ matrix.comp }}" --entry "${{ matrix.entry }}" --fps 5 --scale 0.15 --min-static 2 --out "out/main-qa/${{ matrix.suite }}/motion"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'main-qa-${{ matrix.suite }}', path: out/main-qa, retention-days: 7, if-no-files-found: ignore }
  banding:
    name: Banding check (dither x presets)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIT_NO_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/kit_banding_check.mjs --out out/banding
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: banding, path: out/banding, retention-days: 7, if-no-files-found: ignore }
  scaffold:
    name: New-video scaffold (install, tsc, still)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIT_NO_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-scaffold-npm-${{ hashFiles('package.json', 'scripts/new-video.mjs') }}
      - name: Scaffold into a temp dir (kit/ is this checkout; no network)
        run: |
          node scripts/new-video.mjs "$RUNNER_TEMP/video" --name "Scaffold Check"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/video/kit"
          test -s "$RUNNER_TEMP/video/CLAUDE.md" || { echo "::error::scaffold is missing CLAUDE.md"; exit 1; }
      - run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/video
      - run: npx tsc --noEmit
        working-directory: ${{ runner.temp }}/video
      - name: Render one still of the demo composition
        run: node scripts/kit_scaffold_still.mjs "$RUNNER_TEMP/video" Scaffold-Check "$RUNNER_TEMP/video/out/still.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: scaffold-still, path: '${{ runner.temp }}/video/out/still.png', retention-days: 7, if-no-files-found: ignore }
  visual:
    name: Visual regression
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIT_NO_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kit-visual-regression, path: out/kit-visual, retention-days: 14, if-no-files-found: ignore }
  # Self-test of the reusable workflows against the kit's own demo compositions (same trigger as the heavy QA).
  reuse-qa:
    name: Reusable QA (self-test)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/reusable-qa.yml
    with: { comps: 'Kit-Scenes-Demo,Kit-ChartHeadline-Demo,Kit-ChartHeadline-Demo-Vertical', entry: src/kit/scenes/entry.tsx, times: '2,7,10', kit_dir: '.', layout_fail: false, artifact: selftest-qa }
    secrets:
      KIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  reuse-preview:
    name: Reusable preview (self-test)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    permissions: { contents: read, actions: read, pages: write, id-token: write }
    uses: ./.github/workflows/reusable-preview.yml
    with: { comps: Kit-Scenes-Demo, entry: src/kit/scenes/entry.tsx, scale: 0.25, fps: 10, every: 6, kit_dir: '.', artifact: selftest-preview }
    secrets:
      KIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  reuse-render:
    name: Reusable render (self-test)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/reusable-render.yml
    with: { comp: Kit-Audio-Demo, entry: src/kit/demo/entry.tsx, frames: '0-89', chunk_frames: 45, kit_dir: '.', output_name: selftest-video, data_tags: audio }
    secrets:
      KIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  reuse-shorts:
    name: Reusable shorts (self-test)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa]')
    needs: fast
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/reusable-shorts.yml
    with: { comps: '["Kit-Ui-Demo-Vertical"]', entry: src/kit/ui/entry.tsx, frames: '0-59', kit_dir: '.' }
    secrets:
      KIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
