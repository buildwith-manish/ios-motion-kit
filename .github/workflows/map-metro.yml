# Renders the MetroMap review stills (hero/dim, three zooms, reveal moments, 4K crops) and measures seconds per frame
# at 1080p and 4K for the light and rich tiers. Manual; results are uploaded as a 14-day artifact.
name: Map metro
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'all | review | perf'
        default: 'all'
permissions:
  contents: read
concurrency:
  group: map-metro
  cancel-in-progress: false
jobs:
  metro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Typecheck (once, before rendering)
        run: npx tsc --noEmit
      - name: Render
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          node scripts/map_metro_stills.mjs --only=${{ inputs.only || 'all' }} 2>&1 | grep -v "^Bundling\|^Copying" | tee docs/map-bake-logs/metro.log
      - name: Collect new outputs (never committed)
        if: always()
        run: |
          mkdir -p out/artifact
          git ls-files -z -o -m docs/previews docs/map-bake-logs | xargs -0 -r cp --parents -t out/artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-metro
          path: out/artifact
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
