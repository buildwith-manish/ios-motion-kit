# Renders the two kit-map demos as short videos (1080p), a short 4K clip, and contact sheets to review the motion.
# Manual; uploaded as a 14-day artifact.
name: Map videos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Render
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          OUT=docs/previews/kit-map/video
          mkdir -p $OUT docs/map-bake-logs
          {
            for spec in "Kit-Map-Highlight-Landscape highlight-landscape" "Kit-Map-Choropleth-Landscape choropleth-landscape"; do
              set -- $spec
              s=$(date +%s)
              npx remotion render src/kit/demo/entry.tsx "$1" "$OUT/$2.mp4" --codec=h264 --crf=20 --concurrency=2 --log=error
              e=$(date +%s)
              frames=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$OUT/$2.mp4")
              echo "$2: $frames frames in $((e-s)) s => $(echo "scale=2; ($e-$s)/$frames" | bc) s/frame (2 workers, software GL, incl. encode)"
              # contact sheet: 12 evenly spaced frames
              ffmpeg -v error -y -i "$OUT/$2.mp4" -vf "fps=$(echo "scale=4; 12/$(ffprobe -v error -show_entries format=duration -of csv=p=0 $OUT/$2.mp4)" | bc),scale=640:-1,tile=4x3" -frames:v 1 "$OUT/$2-sheet.png"
            done
            # 4K clip: first 90 frames of the choropleth stagger fill-in (scale=2 => 3840x2160)
            npx remotion render src/kit/demo/entry.tsx Kit-Map-Choropleth-Landscape "$OUT/choropleth-landscape-4k-clip.mp4" --scale=2 --frames=0-89 --codec=h264 --crf=20 --concurrency=2 --log=error
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of csv=p=0 "$OUT/choropleth-landscape-4k-clip.mp4" | sed 's/^/4k clip w,h,frames: /'
          } 2>&1 | tee docs/map-bake-logs/videos.log
      - name: Collect new outputs (never committed)
        if: always()
        run: |
          mkdir -p out/artifact
          git ls-files -z -o -m docs/previews docs/map-bake-logs | xargs -0 -r cp --parents -t out/artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-videos
          path: out/artifact
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
