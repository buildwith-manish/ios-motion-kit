name: kit-pr

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: node scripts/kit_no_device_chrome.mjs
      - run: node scripts/kit_contrast_tokens.mjs

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIT_NO_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: tokens
            entry: src/kit/demo/entry.tsx
            comp: Kit-Tokens-Demo
            times: 0.8,2,3.2
          - suite: transitions
            entry: src/kit/demo/entry.tsx
            comp: Kit-Transitions-Demo
            times: 1.7,3.9,6.1,8.3,10.5,12.7
          - suite: ui
            entry: src/kit/ui/entry.tsx
            comp: Kit-Ui-Demo,Kit-Ui-Demo-Vertical,Kit-Ui-Demo-30fps
            times: 2,4.5,7.5,8.5
          - suite: scenes
            entry: src/kit/scenes/entry.tsx
            comp: Kit-Scenes-Demo
            times: 2,7,12,17,22,27
    name: QA (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - name: Install QA codec tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Contrast check
        run: node scripts/kit_contrast_check.mjs --comp "${{ matrix.comp }}" --entry "${{ matrix.entry }}" --times "${{ matrix.times }}" --no-images --out "out/pr-qa/${{ matrix.suite }}/contrast"
      - name: Safe-area check
        run: node scripts/kit_safe_area_check.mjs --comp "${{ matrix.comp }}" --entry "${{ matrix.entry }}" --times "${{ matrix.times }}" --no-images --out "out/pr-qa/${{ matrix.suite }}/safe-area"
      - name: Motion audit
        run: node scripts/kit_motion_audit.mjs --comp "${{ matrix.comp }}" --entry "${{ matrix.entry }}" --fps 5 --scale 0.15 --min-static 2 --out "out/pr-qa/${{ matrix.suite }}/motion"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-qa-${{ matrix.suite }}
          path: out/pr-qa
          retention-days: 7
          if-no-files-found: ignore

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIT_NO_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            ~/.cache/ms-playwright
            /tmp/chromium
          key: ${{ runner.os }}-kit-chromium-123.0.1-${{ hashFiles('package-lock.json') }}
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-visual-regression
          path: out/kit-visual
          retention-days: 14
          if-no-files-found: ignore
