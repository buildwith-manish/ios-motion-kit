# Bakes Census cartographic boundary layers to public/kit/map/regions/ and commits them to kit-map.
# Run: Actions -> "Bake map regions" -> Run workflow. Also runs when the baker or this file changes on kit-map.
name: Bake map regions
on:
  workflow_dispatch:
    inputs:
      layers:
        description: 'comma list: states,counties,cbsa,zcta,outline'
        default: 'states,counties,cbsa,zcta,outline'
      tracts:
        description: 'state FIPS list for tracts (on demand), e.g. 08,17'
        default: '08'
      zcta_cbsa:
        description: 'CBSA codes to bake detailed ZIP areas for (on demand), e.g. 19740'
        default: '19740'
      vintage:
        description: 'cartographic boundary vintage (blank = baker default)'
        default: ''
  push:
    branches: [kit-map]
    paths:
      - scripts/map_bake_regions.mjs
      - .github/workflows/map-bake-regions.yml
permissions:
  contents: write
concurrency:
  group: map-bake-regions
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kit-map
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/census
          key: census-${{ github.run_id }}
          restore-keys: census-
      - name: Bake
        env:
          LAYERS: ${{ inputs.layers || 'states,counties,cbsa,zcta,outline' }}
          TRACTS: ${{ inputs.tracts || '08' }}
          ZCTA_CBSA: ${{ inputs.zcta_cbsa || '19740' }}
          VINTAGE: ${{ inputs.vintage }}
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          ARGS="--layers=$LAYERS --tracts=$TRACTS --zcta-cbsa=$ZCTA_CBSA"
          if [ -n "$VINTAGE" ]; then ARGS="$ARGS --vintage=$VINTAGE"; fi
          node scripts/map_bake_regions.mjs $ARGS 2>&1 | tee docs/map-bake-logs/regions.log
      - name: Commit result (data + log, even on failure)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kit/map/regions docs/map-bake-logs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "kit-map: bake region layers [skip ci]"
          git pull --rebase origin kit-map
          git push origin HEAD:kit-map
