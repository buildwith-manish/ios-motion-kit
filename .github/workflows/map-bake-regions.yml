# Bakes Census cartographic boundary layers to public/kit/map/regions/ and publishes changed data as a new release.
# Run: Actions -> "Bake map regions" -> Run workflow. Only the manifest, reports and logs are committed.
name: Bake map regions
on:
  workflow_dispatch:
    inputs:
      layers:
        description: 'comma list: states,counties,cbsa,zcta,outline'
        default: 'states,counties,cbsa,zcta,outline'
      tracts:
        description: 'state FIPS list for tracts (on demand), e.g. 08,17'
        default: '08'
      zcta_cbsa:
        description: 'CBSA codes to bake detailed ZIP areas for (on demand), e.g. 19740'
        default: '19740'
      vintage:
        description: 'cartographic boundary vintage (blank = baker default)'
        default: ''
permissions:
  contents: write
concurrency:
  group: kit-data-bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      - uses: actions/cache@v4
        with:
          path: .cache/census
          key: census-${{ github.run_id }}
          restore-keys: census-
      - name: Bake
        id: bake
        continue-on-error: true
        env:
          LAYERS: ${{ inputs.layers || 'states,counties,cbsa,zcta,outline' }}
          TRACTS: ${{ inputs.tracts || '08' }}
          ZCTA_CBSA: ${{ inputs.zcta_cbsa || '19740' }}
          VINTAGE: ${{ inputs.vintage }}
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          ARGS="--layers=$LAYERS --tracts=$TRACTS --zcta-cbsa=$ZCTA_CBSA"
          if [ -n "$VINTAGE" ]; then ARGS="$ARGS --vintage=$VINTAGE"; fi
          node scripts/map_bake_regions.mjs $ARGS 2>&1 | tee docs/map-bake-logs/regions.log
      - name: Publish changed data as a new release; commit only the manifest, reports and logs
        if: steps.bake.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(sha256sum data-manifest.json)
          node scripts/kit_data_manifest.mjs
          if [ "$before" != "$(sha256sum data-manifest.json)" ]; then
            node scripts/kit_data_manifest.mjs --release "data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            bash scripts/kit_data_publish.sh
          fi
      - name: Commit manifest, reports and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if [ "${{ steps.bake.outcome }}" = "success" ]; then git add data-manifest.json public/kit/map; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "kit-map: bake region layers [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
      - name: Fail the job if the bake failed
        if: steps.bake.outcome == 'failure'
        run: exit 1
