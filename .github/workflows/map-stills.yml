# Renders kit-map demo stills (1080p + 4K crops + city stills) and measures seconds per frame; uploads them as a 14-day artifact.
# Manual only. Never commit the 4K output.
name: Map stills
on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'city ids (blank = all in cities.json)'
        default: ''
permissions:
  contents: read
concurrency:
  group: map-stills
  cancel-in-progress: false
jobs:
  stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch baked map data and audio (kept out of git)
        run: npm run kit:fetch-data
      # the stills script crops its 4K review images with ImageMagick, which the runner image may not ship
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Render
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p docs/map-bake-logs
          ARGS=""
          if [ -n "${{ inputs.cities }}" ]; then ARGS="--cities=${{ inputs.cities }}"; fi
          node scripts/map_stills.mjs $ARGS 2>&1 | tee docs/map-bake-logs/stills.log
      - name: Collect new outputs (never committed)
        if: always()
        run: |
          mkdir -p out/artifact
          git ls-files -z -o -m docs/previews docs/map-bake-logs | xargs -0 -r cp --parents -t out/artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-stills
          path: out/artifact
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if the render failed
        if: steps.render.outcome == 'failure'
        run: exit 1
